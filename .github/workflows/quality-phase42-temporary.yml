name: Phase 42 Resource Gateways QA

on:
  push:
    branches: [ai-office-phase42-resource-gateways]

jobs:
  resource-gateways:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check api/image-gateway.ts
          node --check api/ingest-gateway.ts
          node --check tests/artifact-engine-v24.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Artifact and resource gateway regression
        run: node tests/artifact-engine-v24.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
