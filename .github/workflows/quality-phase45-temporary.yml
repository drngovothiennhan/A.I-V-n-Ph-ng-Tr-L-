name: Phase 45 Retired Versioned Research QA

on:
  push:
    branches: [ai-office-phase45-retire-versioned-research]

jobs:
  retired-versioned-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax and routing checks
        run: |
          cp api/research-legacy-retired.ts /tmp/research-legacy-retired.mjs
          node --check /tmp/research-legacy-retired.mjs
          node --check tests/vercel-research-route-v39.test.mjs
          node --check tests/research-relevance-v25.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Stable and retired research route regression
        run: node tests/vercel-research-route-v39.test.mjs
      - name: Research relevance internal-chain regression
        run: node tests/research-relevance-v25.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
