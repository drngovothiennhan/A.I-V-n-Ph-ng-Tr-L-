name: Phase 44 Exact-Source Selftest QA

on:
  push:
    branches: [ai-office-phase44-selftest-release-gate]

jobs:
  selftest-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          cp api/selftest.ts /tmp/selftest-phase44.mjs
          node --check /tmp/selftest-phase44.mjs
          node --check tests/deployment-release-coherence-v45.test.mjs
          node --check tests/deployment-promotion-gate-v46.test.mjs
      - name: Exact-source selftest and release coherence regression
        run: node tests/deployment-release-coherence-v45.test.mjs
      - name: Candidate promotion regression
        run: node tests/deployment-promotion-gate-v46.test.mjs
      - name: Office artifact round-trip regression
        run: node tests/artifact-engine-v24.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
