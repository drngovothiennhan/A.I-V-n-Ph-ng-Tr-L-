name: Gemini Fast QA Production Verification

on:
  workflow_run:
    workflows: ["Office V2 Scoped Production Release"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-gemini-fast-qa-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-ai:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Bind verified Vercel project deterministically
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          rm -rf .vercel
          mkdir -p .vercel
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.vercel/project.json',JSON.stringify({
            orgId:process.env.VERCEL_ORG_ID,
            projectId:process.env.VERCEL_PROJECT_ID
          }));
          NODE
          node -e "const p=require('./.vercel/project.json'); if(p.projectId!==process.env.VERCEL_PROJECT_ID||p.orgId!==process.env.VERCEL_ORG_ID) process.exit(1); console.log('Vercel project binding verified:',p.projectId,p.orgId)"

      - name: Resolve current production deployment
        id: production
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/ai-van-phong-tro-ly.vercel.app?teamId=$VERCEL_ORG_ID" \
            -o /tmp/current-production.json
          PROD_ID="$(node -e "const d=require('/tmp/current-production.json');process.stdout.write(String(d.id||''))")"
          PROD_HOST="$(node -e "const d=require('/tmp/current-production.json');process.stdout.write(String(d.url||''))")"
          if [[ ! "$PROD_ID" =~ ^dpl_ ]] || [ -z "$PROD_HOST" ]; then
            echo "::error::Could not resolve current production deployment"
            exit 1
          fi
          echo "id=$PROD_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://$PROD_HOST" >> "$GITHUB_OUTPUT"
          echo "Resolved current production deployment: $PROD_ID ($PROD_HOST)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Gemini Google Search fast knowledge answer
        shell: bash
        run: |
          PROD_URL="${{ steps.production.outputs.url }}"
          test -n "$PROD_URL"
          vercel curl "$PROD_URL/api/research" -- \
            --fail --silent --show-error --max-time 18 \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"query":"Thủ đô của Việt Nam là thành phố nào?","mode":"general_question","useInternal":false,"fastAnswer":true}' \
            -o /tmp/gemini-fast-qa.json

          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/gemini-fast-qa.json','utf8'));
          const sources=Array.isArray(data.sources)?data.sources:[];
          if(data.provider!=='gemini-google-search-fast') throw new Error(`unexpected provider: ${data.provider}`);
          if(data.contextPolicy!=='current-query-only') throw new Error(`unexpected context policy: ${data.contextPolicy}`);
          if(data.grounded!==true||data.verificationStatus!=='verified') throw new Error(`grounding not verified: ${data.verificationStatus}`);
          if(!String(data.answer||'').trim()) throw new Error('empty Gemini answer');
          if(!sources.some(s=>/^https?:\/\//.test(String(s?.url||'')))) throw new Error('no public Google grounding source');
          if(Number(data.latencyMs||0)<=0||Number(data.latencyMs)>12000) throw new Error(`fast QA latency out of contract: ${data.latencyMs}`);
          console.log(`Gemini Fast QA production PASS provider=${data.provider} sources=${sources.length} latencyMs=${data.latencyMs}`);
          NODE
