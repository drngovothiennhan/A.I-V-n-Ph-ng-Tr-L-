name: Gemini Fast QA Production Verification

on:
  workflow_run:
    workflows: ["Office V2 Scoped Production Release"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-gemini-fast-qa-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-ai:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Verify Gemini Google Search fast knowledge answer
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          vercel curl "https://ai-van-phong-tro-ly.vercel.app/api/research" --token="$VERCEL_TOKEN" -- \
            --fail --silent --show-error --max-time 18 \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"query":"Thủ đô của Việt Nam là thành phố nào?","mode":"general_question","useInternal":false,"fastAnswer":true}' \
            -o /tmp/gemini-fast-qa.json

          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/gemini-fast-qa.json','utf8'));
          const sources=Array.isArray(data.sources)?data.sources:[];
          if(data.provider!=='gemini-google-search-fast') throw new Error(`unexpected provider: ${data.provider}`);
          if(data.contextPolicy!=='current-query-only') throw new Error(`unexpected context policy: ${data.contextPolicy}`);
          if(data.grounded!==true||data.verificationStatus!=='verified') throw new Error(`grounding not verified: ${data.verificationStatus}`);
          if(!String(data.answer||'').trim()) throw new Error('empty Gemini answer');
          if(!sources.some(s=>/^https?:\/\//.test(String(s?.url||'')))) throw new Error('no public Google grounding source');
          if(Number(data.latencyMs||0)<=0||Number(data.latencyMs)>12000) throw new Error(`fast QA latency out of contract: ${data.latencyMs}`);
          console.log(`Gemini Fast QA production PASS provider=${data.provider} sources=${sources.length} latencyMs=${data.latencyMs}`);
          NODE
