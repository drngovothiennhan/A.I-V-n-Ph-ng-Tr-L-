name: Phase 37 Zero-Model Aggregate Probe QA

on:
  push:
    branches: [ai-office-phase37-zero-model-aggregate-probe]

jobs:
  zero-model-provider-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check api/provider-check.ts
          node --check tests/credential-probe-quota-v47.test.mjs
      - name: Provider quota regression
        run: node tests/credential-probe-quota-v47.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
