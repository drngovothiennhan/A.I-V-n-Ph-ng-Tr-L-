name: Office V2 + Office OS Core QA

on:
  push:
    branches: [main, ai-office-v60-scoped-shadow-release, ai-office-os-p0-p1-scope-shell, ai-office-os-p2-p3-connectors-chief-brain]
    paths:
      - 'api/app.ts'
      - 'src/bootstrap-v17.js'
      - 'src/release-v193.js'
      - 'src/canonical-input-gate-v71.js'
      - 'src/office-v2/**'
      - 'src/office-os/**'
      - 'tests/office-v2-*.test.mjs'
      - 'tests/office-os-*.test.mjs'
      - 'docs/MASTER_EXECUTION_PROMPT_OFFICE_V2.md'
      - 'docs/AI_OFFICE_OS_SCOPE_LOCK.md'
      - '.github/workflows/quality-office-v2.yml'
      - '.github/workflows/release-phase53-scoped-production.yml'
  pull_request:
    paths:
      - 'api/app.ts'
      - 'src/bootstrap-v17.js'
      - 'src/release-v193.js'
      - 'src/canonical-input-gate-v71.js'
      - 'src/office-v2/**'
      - 'src/office-os/**'
      - 'tests/office-v2-*.test.mjs'
      - 'tests/office-os-*.test.mjs'
      - 'docs/MASTER_EXECUTION_PROMPT_OFFICE_V2.md'
      - 'docs/AI_OFFICE_OS_SCOPE_LOCK.md'
      - '.github/workflows/quality-office-v2.yml'
      - '.github/workflows/release-phase53-scoped-production.yml'
  workflow_dispatch:

jobs:
  office-v2-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax check Office V2, Office OS and canonical hook
        run: |
          node --check src/bootstrap-v17.js
          node --check src/release-v193.js
          node --check src/canonical-input-gate-v71.js
          node --check src/office-v2/contracts.js
          node --check src/office-v2/knowledge-gateway.js
          node --check src/office-v2/task-engine.js
          node --check src/office-v2/chief-delegation.js
          node --check src/office-v2/task-runtime-bridge.js
          node --check src/office-v2/task-workspace.js
          node --check src/office-v2/ui-v2-shell.js
          node --check src/office-v2/lean-dashboard-v72.js
          node --check src/office-v2/mobile-shell-v73.js
          node --check src/office-v2/chief-of-staff.js
          node --check src/office-v2/legacy-bridge.js
          node --check src/office-v2/shadow-runtime.js
          node --check src/office-v2/shadow-interceptor.js
          node --check src/office-v2/index.js
          node --check src/office-os/office-shell-v1.js
          node --check src/office-os/connector-registry-v1.js
          node --check src/office-os/answer-policy-v1.js
          node --check src/office-os/chief-answer-router-v1.js
      - name: Office V2 contract, privacy, shadow-hook and release-gate tests
        run: node --test tests/office-v2-*.test.mjs
      - name: Office OS P1-P3 scope, shell, connector and Chief brain tests
        run: node --test tests/office-os-*.test.mjs
      - name: Protect Phase 56 production contracts
        run: |
          node --test tests/ai-orchestrator-core-v32.test.mjs
          node --test tests/proxy-chief-resilience-v37.test.mjs
          node --test tests/vercel-function-budget-v54.test.mjs
          node --test tests/vercel-gateway-esm-runtime-v56.test.mjs
