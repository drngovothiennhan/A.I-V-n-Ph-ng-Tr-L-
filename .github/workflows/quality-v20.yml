name: Source Router + Interaction QA

on:
  push:
    branches: [main, ai-office-phase12-global-cancel, ai-office-phase14-authorization, ai-office-phase15-context, ai-office-phase16-17-centers, ai-office-phase18-chief-timeout, ai-office-phase19-deploy-truth, ai-office-phase20-research-route, ai-office-phase21-economy-model, ai-office-phase22-provider-smoke, ai-office-phase24-xiaozhi-version, ai-office-phase26-source-commit, ai-office-phase27-immutable-assets, ai-office-phase28-full-release-smoke, ai-office-phase30-promote-gate, ai-office-phase32-post-promotion-rollback, ai-office-phase33-canonical-quota-gate, ai-office-phase34-gemini-config-gate, ai-office-phase35-vercel-cli-pin]
  workflow_dispatch:

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check src/bootstrap-v17.js
          node --check src/source-policy-v20.js
          node --check src/knowledge-router-v20.js
          node --check src/multisource-orchestrator-v26.js
          node --check src/research-safety-guard-v263.js
          node --check src/interaction-policy-v21.js
          node --check src/interaction-policy-v22.js
          node --check src/context-manager-v35.js
          node --check src/ai-orchestrator-core-v32.js
          node --check src/interaction-runtime-v22.js
          node --check src/interaction-runtime-v23.js
          node --check src/global-cancel-v33.js
          node --check src/authorization-broker-v34.js
          node --check src/operations-center-v36.js
          node --check src/weather-bridge-v21.js
          node --check src/interaction-control-v21.js
          node --check src/voice/xiaozhi-voice-fabric.js
          node --check src/credential-setup-v22.js
          node --check src/voice-render-bridge-v23.js
          node --check src/voice-turn-coordinator-v25.js
          node --check src/product-completion-v24.js
          node --check services/xiaozhi-render/server.js
          node --check src/release-v193.js
          node --check api/_drive-registry.js
          node --check api/_office-artifacts.js
          node --check api/_artifact-engine.js
          node --check api/_office-ingest.js
          cp integrations/google-apps-script/DriveBrainBridge.gs /tmp/drive-brain-bridge-v24.mjs
          node --check /tmp/drive-brain-bridge-v24.mjs
          cp api/drive-brain.ts /tmp/drive-brain-v25.mjs
          node --check /tmp/drive-brain-v25.mjs
          cp api/health.ts /tmp/health-v25.mjs
          node --check /tmp/health-v25.mjs
          cp api/research.ts /tmp/research-v25.mjs
          node --check /tmp/research-v25.mjs
          cp api/proxy.ts /tmp/proxy-v37.mjs
          node --check /tmp/proxy-v37.mjs
          cp api/image.ts /tmp/image-v24.mjs
          node --check /tmp/image-v24.mjs
          cp api/ingest.ts /tmp/ingest-v24.mjs
          node --check /tmp/ingest-v24.mjs
          cp api/selftest.ts /tmp/selftest-v24.mjs
          node --check /tmp/selftest-v24.mjs
          node --check api/provider-check.ts
          node --check tests/context-manager-v35.test.mjs
          node --check tests/global-cancel-v33.test.mjs
          node --check tests/authorization-broker-v34.test.mjs
          node --check tests/operations-center-v36.test.mjs
          node --check tests/proxy-chief-resilience-v37.test.mjs
          node --check tests/deployment-truthfulness-v38.test.mjs
          node --check tests/vercel-research-route-v39.test.mjs
          node --check tests/gemini-economy-model-v40.test.mjs
          node --check tests/provider-smoke-contract-v41.test.mjs
          node --check tests/xiaozhi-version-contract-v42.test.mjs
          node --check tests/source-commit-runtime-v43.test.mjs
          node --check tests/immutable-runtime-assets-v44.test.mjs
          node --check tests/deployment-release-coherence-v45.test.mjs
          node --check tests/deployment-promotion-gate-v46.test.mjs
          node --check tests/credential-probe-quota-v47.test.mjs
          node --check tests/deployment-rollback-recovery-v48.test.mjs
          node --check tests/deployment-gemini-config-v49.test.mjs
          node --check tests/deployment-vercel-cli-pin-v50.test.mjs
      - name: Source policy regression suite
        run: node tests/source-policy-v20.test.mjs
      - name: Multi-source orchestrator regression suite
        run: node tests/multisource-orchestrator-v26.test.mjs
      - name: Research relevance and grounding regression
        run: node tests/research-relevance-v25.test.mjs
      - name: Client high-stakes research safety regression
        run: node tests/research-safety-guard-v263.test.mjs
      - name: Interaction v2.1 regression suite
        run: node tests/interaction-policy-v21.test.mjs
      - name: Interaction v2.2 regression suite
        run: node tests/interaction-policy-v22.test.mjs
      - name: Bounded context regression
        run: node tests/context-manager-v35.test.mjs
      - name: Global cancel + canonical runtime regression
        run: node tests/global-cancel-v33.test.mjs
      - name: Authorization broker regression
        run: node tests/authorization-broker-v34.test.mjs
      - name: Operations Center regression
        run: node tests/operations-center-v36.test.mjs
      - name: Chief timeout resilience regression
        run: node tests/proxy-chief-resilience-v37.test.mjs
      - name: Deployment truthfulness regression
        run: node tests/deployment-truthfulness-v38.test.mjs
      - name: Stable research route regression
        run: node tests/vercel-research-route-v39.test.mjs
      - name: Gemini economy routing regression
        run: node tests/gemini-economy-model-v40.test.mjs
      - name: Provider smoke contract regression
        run: node tests/provider-smoke-contract-v41.test.mjs
      - name: XiaoZhi version telemetry regression
        run: node tests/xiaozhi-version-contract-v42.test.mjs
      - name: Runtime source commit regression
        run: node tests/source-commit-runtime-v43.test.mjs
      - name: Immutable runtime shell/assets regression
        run: node tests/immutable-runtime-assets-v44.test.mjs
      - name: Deployment release coherence regression
        run: node tests/deployment-release-coherence-v45.test.mjs
      - name: Candidate promotion gate regression
        run: node tests/deployment-promotion-gate-v46.test.mjs
      - name: Credential provider probe quota regression
        run: node tests/credential-probe-quota-v47.test.mjs
      - name: Post-promotion rollback recovery regression
        run: node tests/deployment-rollback-recovery-v48.test.mjs
      - name: Gemini configuration release gate regression
        run: node tests/deployment-gemini-config-v49.test.mjs
      - name: Vercel CLI pin regression
        run: node tests/deployment-vercel-cli-pin-v50.test.mjs
      - name: Office business workflow regression
        run: node tests/business-workflow-v24.test.mjs
      - name: Drive Brain registry regression
        run: node tests/drive-registry-v24.test.mjs
      - name: Drive Brain bridge contract regression
        run: node tests/drive-bridge-contract-v24.test.mjs
      - name: Drive Brain multi-provider readonly regression
        run: node tests/drive-runtime-provider-v25.test.mjs
      - name: XiaoZhi client continuity contract
        run: node tests/xiaozhi-client-contract-v24.test.mjs
      - name: XiaoZhi gateway live fallback regression
        run: node tests/xiaozhi-gateway-v24.test.mjs
      - name: Office artifact round-trip regression
        run: node tests/artifact-engine-v24.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high

  deploy-production:
    needs: source-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require deployment credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured; production deployment cannot run."
            echo "BLOCKED: VERCEL_TOKEN is not configured; candidate deployment, promotion, rollback recovery and production smoke did not run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Deployment credential present; current production will be captured before candidate work." >> "$GITHUB_STEP_SUMMARY"
      - name: Capture current production deployment
        id: previous
        shell: bash
        run: |
          curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/ai-van-phong-tro-ly.vercel.app?teamId=$VERCEL_ORG_ID" -o /tmp/previous-deployment.json
          PREVIOUS_ID="$(node -e "const d=require('/tmp/previous-deployment.json');process.stdout.write(String(d.id||''))")"
          PREVIOUS_URL="$(node -e "const d=require('/tmp/previous-deployment.json');process.stdout.write(String(d.url||''))")"
          if [[ ! "$PREVIOUS_ID" =~ ^dpl_ ]] || [ -z "$PREVIOUS_URL" ]; then
            echo "::error::Could not resolve the currently serving production deployment."
            exit 1
          fi
          curl --fail --silent --show-error -D /tmp/previous-health.headers https://ai-van-phong-tro-ly.vercel.app/api/health -o /tmp/previous-health.json
          PREVIOUS_SOURCE_COMMIT="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/previous-health.headers | tail -1)"
          echo "id=$PREVIOUS_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://$PREVIOUS_URL" >> "$GITHUB_OUTPUT"
          echo "source_commit=$PREVIOUS_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Captured serving production before release: $PREVIOUS_ID ($PREVIOUS_URL), source=${PREVIOUS_SOURCE_COMMIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production candidate without traffic
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --prod --skip-domain --env "AI_OFFICE_SOURCE_COMMIT=$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production-environment candidate (not promoted): $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Candidate smoke test
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          vercel curl /api/health --deployment "$URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 -D /tmp/candidate-health.headers -o /tmp/candidate-health.json
          node -e "const h=require('/tmp/candidate-health.json'); if(h.status!=='ok'||h.productCompletion!=='2.4-summary-file-image-delivery'||h.providers?.gemini?.configured!==true||h.providers?.gemini?.model!=='gemini-3.8-flash'||h.providers?.gemini?.economyModel!=='gemini-3.5-flash-lite') process.exit(1); console.log('candidate health/provider ok:',h.productCompletion,h.providers?.gemini?.configured,h.providers?.gemini?.model,h.providers?.gemini?.economyModel)"
          SOURCE_COMMIT="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/candidate-health.headers | tail -1)"
          if [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate source mismatch. expected=$GITHUB_SHA actual=${SOURCE_COMMIT:-missing}"
            exit 1
          fi

          vercel curl / --deployment "$URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -D /tmp/candidate-ui.headers -o /tmp/candidate-ui.html
          UI_SOURCE_REF="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-ui-source-ref:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/candidate-ui.headers | tail -1)"
          if [ "$UI_SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate dashboard source mismatch. expected=$GITHUB_SHA actual=${UI_SOURCE_REF:-missing}"
            exit 1
          fi

          vercel curl /src/research-safety-guard-v263.js --deployment "$URL" --token="$VERCEL_TOKEN" -- --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -D /tmp/candidate-asset.headers -o /tmp/candidate-safety.js
          ASSET_SOURCE_REF="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-asset-source-ref:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/candidate-asset.headers | tail -1)"
          if [ "$ASSET_SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate runtime asset mismatch. expected=$GITHUB_SHA actual=${ASSET_SOURCE_REF:-missing}"
            exit 1
          fi
          grep -q "2.6.3-client-research-safety-guard" /tmp/candidate-safety.js

          vercel curl /api/selftest --deployment "$URL" --token="$VERCEL_TOKEN" -- --request POST --header "x-ai-office-selftest-source: $GITHUB_SHA" --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/candidate-selftest.json
          node -e "const t=require('/tmp/candidate-selftest.json'); if(t.pass!==true||t.engine!=='internal-office-xml-v24'||t.sourceCommit!==process.env.GITHUB_SHA) process.exit(1); console.log('candidate artifact selftest ok:',t.engine,t.sourceCommit)"
          echo "Candidate verified before traffic: health=$SOURCE_COMMIT ui=$UI_SOURCE_REF asset=$ASSET_SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote verified candidate
        id: promote
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          vercel promote "$URL" --yes --timeout 5m --token="$VERCEL_TOKEN"
          echo "Promoted verified candidate: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Post-promotion production smoke
        id: production-smoke
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 -D /tmp/health.headers https://ai-van-phong-tro-ly.vercel.app/api/health -o /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.productCompletion!=='2.4-summary-file-image-delivery'||h.providers?.gemini?.configured!==true||h.providers?.gemini?.model!=='gemini-3.8-flash'||h.providers?.gemini?.economyModel!=='gemini-3.5-flash-lite') process.exit(1); console.log('production health/provider ok:',h.productCompletion,h.providers?.gemini?.configured,h.providers?.gemini?.model,h.providers?.gemini?.economyModel)"
          SOURCE_COMMIT="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/health.headers | tail -1)"
          if [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Production source mismatch. expected=$GITHUB_SHA actual=${SOURCE_COMMIT:-missing}"
            echo "BLOCKED: promoted production source does not equal validated GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -D /tmp/ui.headers https://ai-van-phong-tro-ly.vercel.app/ -o /tmp/ui.html
          UI_SOURCE_REF="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-ui-source-ref:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/ui.headers | tail -1)"
          if [ "$UI_SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo "::error::Production dashboard source mismatch. expected=$GITHUB_SHA actual=${UI_SOURCE_REF:-missing}"
            exit 1
          fi

          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -D /tmp/asset.headers https://ai-van-phong-tro-ly.vercel.app/src/research-safety-guard-v263.js -o /tmp/safety.js
          ASSET_SOURCE_REF="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-asset-source-ref:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/asset.headers | tail -1)"
          if [ "$ASSET_SOURCE_REF" != "$GITHUB_SHA" ]; then
            echo "::error::Production runtime asset mismatch. expected=$GITHUB_SHA actual=${ASSET_SOURCE_REF:-missing}"
            exit 1
          fi
          grep -q "2.6.3-client-research-safety-guard" /tmp/safety.js

          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --request POST --header "x-ai-office-selftest-source: $GITHUB_SHA" https://ai-van-phong-tro-ly.vercel.app/api/selftest > /tmp/selftest.json
          node -e "const t=require('/tmp/selftest.json'); if(t.pass!==true||t.engine!=='internal-office-xml-v24'||t.sourceCommit!==process.env.GITHUB_SHA) process.exit(1); console.log('production artifact selftest ok:',t.engine,t.sourceCommit)"
          echo "Production promotion verified: health=$SOURCE_COMMIT ui=$UI_SOURCE_REF asset=$ASSET_SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back failed promotion
        if: failure() && steps.promote.outcome == 'success' && steps.previous.outputs.id != ''
        shell: bash
        run: |
          PREVIOUS_ID="${{ steps.previous.outputs.id }}"
          PREVIOUS_SOURCE_COMMIT="${{ steps.previous.outputs.source_commit }}"
          echo "Post-promotion verification failed; requesting rollback to $PREVIOUS_ID." >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --request POST --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_ID?teamId=$VERCEL_ORG_ID&description=automated-post-promotion-smoke-failure"

          RESTORED=0
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/ai-van-phong-tro-ly.vercel.app?teamId=$VERCEL_ORG_ID" -o /tmp/current-production.json || true
            CURRENT_ID="$(node -e "try{const d=require('/tmp/current-production.json');process.stdout.write(String(d.id||''))}catch{process.stdout.write('')}" )"
            if [ "$CURRENT_ID" = "$PREVIOUS_ID" ]; then
              RESTORED=1
              break
            fi
            sleep 3
          done
          if [ "$RESTORED" != "1" ]; then
            echo "::error::Rollback request did not restore the captured production deployment $PREVIOUS_ID."
            exit 1
          fi

          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 -D /tmp/rollback-health.headers https://ai-van-phong-tro-ly.vercel.app/api/health -o /tmp/rollback-health.json
          ROLLBACK_SOURCE_COMMIT="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {gsub(/\r/,\"\",$2); print $2}' /tmp/rollback-health.headers | tail -1)"
          if [ -n "$PREVIOUS_SOURCE_COMMIT" ] && [ "$PREVIOUS_SOURCE_COMMIT" != "unknown" ] && [ "$ROLLBACK_SOURCE_COMMIT" != "$PREVIOUS_SOURCE_COMMIT" ]; then
            echo "::error::Rollback deployment ID restored but source commit mismatch. expected=$PREVIOUS_SOURCE_COMMIT actual=${ROLLBACK_SOURCE_COMMIT:-missing}"
            exit 1
          fi
          echo "Rollback restored deployment: $PREVIOUS_ID, source=${ROLLBACK_SOURCE_COMMIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"