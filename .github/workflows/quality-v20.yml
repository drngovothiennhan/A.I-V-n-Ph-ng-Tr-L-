name: Source Router + Interaction QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check src/bootstrap-v17.js
          node --check src/source-policy-v20.js
          node --check src/knowledge-router-v20.js
          node --check src/interaction-policy-v21.js
          node --check src/interaction-policy-v22.js
          node --check src/interaction-runtime-v22.js
          node --check src/weather-bridge-v21.js
          node --check src/interaction-control-v21.js
          node --check src/voice/xiaozhi-voice-fabric.js
          node --check src/credential-setup-v22.js
          node --check src/voice-render-bridge-v23.js
          node --check src/product-completion-v24.js
          node --check services/xiaozhi-render/server.js
          node --check src/release-v193.js
          cp api/research.ts /tmp/research-v20.mjs
          node --check /tmp/research-v20.mjs
          cp api/image.ts /tmp/image-v24.mjs
          node --check /tmp/image-v24.mjs
      - name: Source policy regression suite
        run: node tests/source-policy-v20.test.mjs
      - name: Interaction v2.1 regression suite
        run: node tests/interaction-policy-v21.test.mjs
      - name: Interaction v2.2 regression suite
        run: node tests/interaction-policy-v22.test.mjs
