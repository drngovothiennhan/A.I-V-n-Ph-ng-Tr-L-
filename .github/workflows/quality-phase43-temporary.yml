name: Phase 43 Retired Legacy XiaoZhi QA

on:
  push:
    branches: [ai-office-phase43-retire-legacy-ws]

jobs:
  retired-legacy-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check api/ws-xiaozhi.ts
          node --check tests/xiaozhi-version-contract-v42.test.mjs
          node --check services/xiaozhi-render/server.js
      - name: Direct Render and retired bridge regression
        run: node tests/xiaozhi-version-contract-v42.test.mjs
      - name: XiaoZhi gateway live fallback regression
        run: node tests/xiaozhi-gateway-v24.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
