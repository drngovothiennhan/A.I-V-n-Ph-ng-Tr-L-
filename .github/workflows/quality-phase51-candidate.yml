name: Phase 55 Vercel Route Map Candidate QA

on:
  push:
    branches: [ai-office-phase55-vercel-route-map]

permissions:
  contents: read

jobs:
  route-map-candidate:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Route-map and release regressions
        run: |
          node tests/source-policy-v20.test.mjs
          node tests/vercel-typescript-build-v53.test.mjs
          node tests/vercel-function-budget-v54.test.mjs
          node tests/vercel-research-route-v39.test.mjs
          node tests/proxy-chief-resilience-v37.test.mjs
          node tests/drive-runtime-provider-v25.test.mjs
          node tests/artifact-engine-v24.test.mjs
          npm audit --omit=dev --audit-level=high
      - name: Require scoped deployment credential
        run: test -n "$VERCEL_TOKEN"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Bind verified Vercel project deterministically
        shell: bash
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID
          }));
          NODE
      - name: Deploy no-traffic production candidate
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prod --skip-domain --yes --env "AI_OFFICE_SOURCE_COMMIT=$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "No-traffic Phase 55 candidate built: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "NO PROMOTION WAS REQUESTED." >> "$GITHUB_STEP_SUMMARY"
