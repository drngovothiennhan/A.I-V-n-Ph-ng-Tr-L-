name: Phase 55 Vercel Route Map Candidate QA

on:
  push:
    branches: [ai-office-phase55-vercel-route-map]

permissions:
  contents: read

jobs:
  route-map-candidate:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Route-map and release regressions
        run: |
          node tests/source-policy-v20.test.mjs
          node tests/vercel-typescript-build-v53.test.mjs
          node tests/vercel-function-budget-v54.test.mjs
          node tests/vercel-research-route-v39.test.mjs
          node tests/proxy-chief-resilience-v37.test.mjs
          node tests/drive-runtime-provider-v25.test.mjs
          node tests/artifact-engine-v24.test.mjs
          npm audit --omit=dev --audit-level=high
      - name: Require scoped deployment credential
        run: test -n "$VERCEL_TOKEN"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Bind verified Vercel project deterministically
        shell: bash
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID
          }));
          NODE
      - name: Deploy no-traffic production candidate
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prod --skip-domain --yes --env "AI_OFFICE_SOURCE_COMMIT=$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          test -n "$URL"
          HOST="${URL#https://}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$HOST?teamId=$VERCEL_ORG_ID" \
            -o /tmp/candidate.json
          CANDIDATE_ID="$(node -e "const d=require('/tmp/candidate.json');process.stdout.write(String(d.id||''))")"
          [[ "$CANDIDATE_ID" =~ ^dpl_ ]]
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"
          echo "No-traffic Phase 55 candidate built: $CANDIDATE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "NO PROMOTION WAS REQUESTED." >> "$GITHUB_STEP_SUMMARY"

      - name: Create ephemeral candidate protection bypass
        shell: bash
        run: |
          CANDIDATE_ID="${{ steps.deploy.outputs.id }}"
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"ttl":600}' \
            "https://api.vercel.com/aliases/$CANDIDATE_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            -o /tmp/bypass.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/bypass.json','utf8'));
          const known=new Set(['createdAt','createdBy','scope','access','lastUpdatedAt','lastUpdatedBy','protectionBypass','uid','alias','deploymentId','projectId','value']);
          let secret=typeof data.value==='string' ? data.value : '';
          const visit=(obj,depth=0)=>{
            if(secret||!obj||typeof obj!=='object'||depth>4) return;
            if(obj.protectionBypass && typeof obj.protectionBypass==='object'){
              for(const key of Object.keys(obj.protectionBypass)){
                if(!known.has(key)&&key.length>=20){ secret=key; return; }
              }
            }
            for(const [key,val] of Object.entries(obj)){
              if(secret) return;
              if(!known.has(key)&&key.length>=20&&val&&typeof val==='object') { secret=key; return; }
              if(val&&typeof val==='object') visit(val,depth+1);
            }
          };
          visit(data);
          if(!secret) throw new Error('Protection bypass secret was not present in the Vercel response');
          fs.writeFileSync('/tmp/bypass-secret', secret, {mode:0o600});
          NODE
          echo "Ephemeral Vercel candidate bypass created (TTL 600s; secret not logged)." >> "$GITHUB_STEP_SUMMARY"

      - name: Exact-source candidate smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          BYPASS="$(cat /tmp/bypass-secret)"
          JAR=/tmp/candidate-cookie.jar
          SHARE="_vercel_share=$BYPASS"

          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 2 \
            --cookie-jar "$JAR" --cookie "$JAR" \
            -D /tmp/health.headers "$URL/api/health?$SHARE" -o /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.productCompletion!=='2.4-summary-file-image-delivery'||h.providers?.gemini?.configured!==true||h.providers?.gemini?.model!=='gemini-3.8-flash'||h.providers?.gemini?.economyModel!=='gemini-3.5-flash-lite') process.exit(1)"
          HEALTH_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {print $2}' /tmp/health.headers | tail -1 | tr -d '\r')"
          [ "$HEALTH_SOURCE" = "$GITHUB_SHA" ]

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --cookie-jar "$JAR" --cookie "$JAR" \
            -D /tmp/ui.headers "$URL/?$SHARE" -o /tmp/ui.html
          UI_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-ui-source-ref:/ {print $2}' /tmp/ui.headers | tail -1 | tr -d '\r')"
          [ "$UI_SOURCE" = "$GITHUB_SHA" ]
          grep -q "A.I Văn phòng" /tmp/ui.html
          grep -q "/src/bootstrap-v18.js" /tmp/ui.html

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --cookie-jar "$JAR" --cookie "$JAR" \
            -D /tmp/asset.headers "$URL/src/research-safety-guard-v263.js?$SHARE" -o /tmp/safety.js
          ASSET_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-asset-source-ref:/ {print $2}' /tmp/asset.headers | tail -1 | tr -d '\r')"
          [ "$ASSET_SOURCE" = "$GITHUB_SHA" ]
          grep -q "2.6.3-client-research-safety-guard" /tmp/safety.js

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            --cookie-jar "$JAR" --cookie "$JAR" \
            --request POST \
            --header "x-ai-office-selftest-source: $GITHUB_SHA" \
            "$URL/api/selftest?$SHARE" -o /tmp/selftest.json
          node -e "const t=require('/tmp/selftest.json'); if(t.pass!==true||t.engine!=='internal-office-xml-v24'||t.sourceCommit!==process.env.GITHUB_SHA) process.exit(1)"

          rm -f /tmp/bypass-secret "$JAR"
          echo "Phase 55 protected candidate smoke PASS: health + dashboard + immutable asset + Office selftest, source=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
