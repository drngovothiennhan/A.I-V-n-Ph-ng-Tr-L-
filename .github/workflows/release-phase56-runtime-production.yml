name: Phase 56 Runtime Production Release

on:
  push:
    branches: [ai-office-phase56-promote]
    paths:
      - '.github/workflows/release-phase56-runtime-production.yml'

permissions:
  contents: read

jobs:
  promote-runtime-candidate:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
      TARGET_SOURCE_SHA: 1c0d13708339e705ae2f10e5e363f8f51d01b0a3
      CANDIDATE_ID: dpl_65VBcfTe61MCEekGEZ9bEXaon1P5
      STABLE_ROLLBACK_ID: dpl_DfW8oQE4WTrsQTJxLVWtVmfi3sca
      STABLE_ROLLBACK_SOURCE: 825dbf8073284eadc38800245f42d4f70f647c98
      PRODUCTION_URL: https://ai-van-phong-tro-ly.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock release to exact main source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          git fetch origin main --quiet
          MAIN_SHA="$(git rev-parse origin/main)"
          [ "$MAIN_SHA" = "$TARGET_SOURCE_SHA" ]
          echo "Exact main source lock PASS: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tested candidate identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$CANDIDATE_ID?teamId=$VERCEL_ORG_ID" \
            -o /tmp/candidate.json
          node - <<'NODE'
          const d=require('/tmp/candidate.json');
          if(d.id!==process.env.CANDIDATE_ID) process.exit(1);
          if((d.readyState||d.state)!=='READY') process.exit(1);
          if((d.meta?.githubCommitSha||'')!==process.env.TARGET_SOURCE_SHA) process.exit(1);
          if(!String(d.meta?.lambdaRuntimeStats||'').includes('nodejs')) process.exit(1);
          NODE
          echo "Verified tested candidate: $CANDIDATE_ID source=$TARGET_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm stable rollback target
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$STABLE_ROLLBACK_ID?teamId=$VERCEL_ORG_ID" \
            -o /tmp/stable.json
          node - <<'NODE'
          const d=require('/tmp/stable.json');
          if(d.id!==process.env.STABLE_ROLLBACK_ID) process.exit(1);
          if((d.readyState||d.state)!=='READY') process.exit(1);
          NODE
          echo "Stable rollback target available: $STABLE_ROLLBACK_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote exact Phase 56 candidate
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$CANDIDATE_ID?teamId=$VERCEL_ORG_ID" \
            -o /tmp/promote.json
          echo "Promotion accepted for $CANDIDATE_ID; waiting for public source propagation." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for public source propagation
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 60); do
            curl --silent --show-error -D /tmp/prop.headers \
              "$PRODUCTION_URL/api/health?phase56_propagation=$attempt-$(date +%s%N)" \
              -o /tmp/prop.json || true
            SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {print $2}' /tmp/prop.headers 2>/dev/null | tail -1 | tr -d '\r')"
            if [ "$SOURCE" = "$TARGET_SOURCE_SHA" ]; then READY=1; break; fi
            sleep 2
          done
          [ "$READY" = "1" ]
          echo "Public source propagation PASS: $TARGET_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Public production smoke — static and Office engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -D /tmp/health.headers "$PRODUCTION_URL/api/health?phase56_smoke=$(date +%s%N)" \
            -o /tmp/health.json
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(h.status!=='ok') process.exit(1);
          if(h.productCompletion!=='2.4-summary-file-image-delivery') process.exit(1);
          if(h.providers?.gemini?.configured!==true) process.exit(1);
          if(h.providers?.gemini?.model!=='gemini-3.8-flash') process.exit(1);
          if(h.providers?.googleDriveRuntime?.configured!==false) process.exit(1);
          if(h.providers?.googleWorkspace?.configured!==false) process.exit(1);
          NODE
          HEALTH_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {print $2}' /tmp/health.headers | tail -1 | tr -d '\r')"
          [ "$HEALTH_SOURCE" = "$TARGET_SOURCE_SHA" ]

          curl --fail --silent --show-error \
            -D /tmp/ui.headers "$PRODUCTION_URL/?phase56_smoke=$(date +%s%N)" \
            -o /tmp/ui.html
          UI_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-ui-source-ref:/ {print $2}' /tmp/ui.headers | tail -1 | tr -d '\r')"
          [ "$UI_SOURCE" = "$TARGET_SOURCE_SHA" ]
          grep -q "A.I Văn phòng" /tmp/ui.html
          grep -q "/src/bootstrap-v18.js" /tmp/ui.html

          curl --fail --silent --show-error \
            -D /tmp/asset.headers "$PRODUCTION_URL/src/research-safety-guard-v263.js?phase56_smoke=$(date +%s%N)" \
            -o /tmp/safety.js
          ASSET_SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-asset-source-ref:/ {print $2}' /tmp/asset.headers | tail -1 | tr -d '\r')"
          [ "$ASSET_SOURCE" = "$TARGET_SOURCE_SHA" ]
          grep -q "2.6.3-client-research-safety-guard" /tmp/safety.js

          curl --fail --silent --show-error \
            --request POST --header "x-ai-office-selftest-source: $TARGET_SOURCE_SHA" \
            "$PRODUCTION_URL/api/selftest?phase56_smoke=$(date +%s%N)" \
            -o /tmp/selftest.json
          node -e "const t=require('/tmp/selftest.json');if(t.pass!==true||t.engine!=='internal-office-xml-v24'||t.sourceCommit!==process.env.TARGET_SOURCE_SHA)process.exit(1)"
          echo "Static + Office production smoke PASS." >> "$GITHUB_STEP_SUMMARY"

      - name: Public production smoke — Gemini and dynamic gateways
        id: dynamic-smoke
        shell: bash
        run: |
          set -euo pipefail
          COMMON_HEADERS=(
            --header 'content-type: application/json'
            --header "referer: $PRODUCTION_URL/"
            --header 'sec-fetch-site: same-origin'
            --header 'sec-fetch-mode: cors'
            --header 'sec-fetch-dest: empty'
          )

          PROXY_CODE="$(curl --silent --show-error -o /tmp/proxy.json -w '%{http_code}' \
            --request POST "${COMMON_HEADERS[@]}" \
            --data '{"message":"Trả lời ngắn gọn: 2 + 2 bằng bao nhiêu?"}' \
            "$PRODUCTION_URL/api/proxy?op=chief&phase56_smoke=$(date +%s%N)")"
          [ "$PROXY_CODE" = "200" ]
          node - <<'NODE'
          const d=require('/tmp/proxy.json');
          if(d.provider!=='gemini'||d.fallback===true||d.providerHealth!=='healthy'||!String(d.reply||'').match(/\b4\b/)){
            console.error({provider:d.provider,fallback:d.fallback,providerHealth:d.providerHealth,upstreamStatus:d.upstreamStatus,reply:String(d.reply||'').slice(0,200)});
            process.exit(1);
          }
          NODE

          RESEARCH_CODE="$(curl --silent --show-error -o /tmp/research.txt -w '%{http_code}' \
            "$PRODUCTION_URL/api/research?phase56_smoke=$(date +%s%N)")"
          [ "$RESEARCH_CODE" = "405" ]

          DRIVE_CODE="$(curl --silent --show-error -o /tmp/drive.json -w '%{http_code}' \
            --request POST "${COMMON_HEADERS[@]}" --data '{"action":"health"}' \
            "$PRODUCTION_URL/api/drive-brain?phase56_smoke=$(date +%s%N)")"
          [ "$DRIVE_CODE" = "200" ]
          node -e "const d=require('/tmp/drive.json');if(d.configured!==false||d.live!==true||d.reason!=='DRIVE_RUNTIME_CREDENTIALS_MISSING')process.exit(1)"

          IMAGE_CODE="$(curl --silent --show-error -o /tmp/image.json -w '%{http_code}' \
            --request POST "${COMMON_HEADERS[@]}" --data '{}' \
            "$PRODUCTION_URL/api/image?phase56_smoke=$(date +%s%N)")"
          [ "$IMAGE_CODE" = "400" ]
          node -e "const d=require('/tmp/image.json');if(d.error!=='PROMPT_REQUIRED')process.exit(1)"

          INGEST_CODE="$(curl --silent --show-error -o /tmp/ingest.json -w '%{http_code}' \
            --request POST "${COMMON_HEADERS[@]}" --data '{}' \
            "$PRODUCTION_URL/api/ingest?phase56_smoke=$(date +%s%N)")"
          [ "$INGEST_CODE" = "400" ]
          node -e "const d=require('/tmp/ingest.json');if(d.error!=='UNSUPPORTED_FILE_TYPE')process.exit(1)"

          echo "Dynamic production smoke PASS — Gemini answered 4; research=405; Drive locked cleanly; image/ingest loaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to known stable release on any post-promotion failure
        if: failure() && steps.promote.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$STABLE_ROLLBACK_ID?teamId=$VERCEL_ORG_ID&description=phase56-production-validation-failure" \
            -o /tmp/rollback.json
          RESTORED=0
          for attempt in $(seq 1 60); do
            curl --silent --show-error -D /tmp/rollback.headers \
              "$PRODUCTION_URL/api/health?phase56_rollback=$attempt-$(date +%s%N)" \
              -o /tmp/rollback-health.json || true
            SOURCE="$(awk 'BEGIN{IGNORECASE=1} /^x-ai-office-source-commit:/ {print $2}' /tmp/rollback.headers 2>/dev/null | tail -1 | tr -d '\r')"
            if [ "$SOURCE" = "$STABLE_ROLLBACK_SOURCE" ]; then RESTORED=1; break; fi
            sleep 2
          done
          [ "$RESTORED" = "1" ]
          echo "ROLLBACK PASS — restored known stable source $STABLE_ROLLBACK_SOURCE." >> "$GITHUB_STEP_SUMMARY"
