name: Phase 50 Scoped Token Pull Probe

on:
  push:
    branches: [ai-office-phase50-deterministic-project-file]

jobs:
  production-pull-probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require credential
        run: test -n "$VERCEL_TOKEN"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Bind deterministic project file
        shell: bash
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json',JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID,projectName:'ai-van-phong-tro-ly'}))"
          node -e "const p=require('./.vercel/project.json'); if(p.projectId!==process.env.VERCEL_PROJECT_ID||p.orgId!==process.env.VERCEL_ORG_ID) process.exit(1); console.log('deterministic project binding verified:',p.projectId,p.orgId)"
      - name: Pull production configuration read-only
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify linked project survived pull
        run: node -e "const p=require('./.vercel/project.json'); if(p.projectId!==process.env.VERCEL_PROJECT_ID||p.orgId!==process.env.VERCEL_ORG_ID) process.exit(1); console.log('production pull project verified:',p.projectId,p.orgId)"
