name: Phase 50 Scoped Token Candidate Probe

on:
  push:
    branches: [ai-office-phase50-deterministic-project-file]

jobs:
  candidate-probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zMTBj85c4Dh5QoDNIjWqQRTg
      VERCEL_PROJECT_ID: prj_SJqoqJ8FvH7CRJzbRRTGWQvIAtSc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require credential
        run: test -n "$VERCEL_TOKEN"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Deploy no-traffic production candidate with scoped token
        id: deploy
        shell: bash
        run: |
          rm -rf .vercel
          URL="$(vercel deploy --prod --skip-domain --yes --env "AI_OFFICE_SOURCE_COMMIT=$GITHUB_SHA")"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Scoped-token candidate created without production traffic: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Report candidate only
        run: |
          echo "Candidate probe succeeded: ${{ steps.deploy.outputs.url }}"
          echo "NO PROMOTION WAS REQUESTED." >> "$GITHUB_STEP_SUMMARY"
