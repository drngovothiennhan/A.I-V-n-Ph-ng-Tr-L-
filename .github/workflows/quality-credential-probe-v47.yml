name: Credential Provider Probe QA

on:
  push:
    branches: [main, ai-office-phase31-manual-provider-probe]
  workflow_dispatch:

jobs:
  provider-probe-quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax checks
        run: |
          node --check src/credential-setup-v22.js
          node --check tests/credential-probe-quota-v47.test.mjs
      - name: Credential provider probe quota regression
        run: node tests/credential-probe-quota-v47.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
