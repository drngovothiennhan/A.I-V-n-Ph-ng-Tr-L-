name: Phase 46 Retired Legacy Health QA

on:
  push:
    branches: [ai-office-phase46-retire-legacy-health]

jobs:
  retired-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Syntax and routing checks
        run: |
          cp api/health-legacy-retired.ts /tmp/health-legacy-retired.mjs
          node --check /tmp/health-legacy-retired.mjs
          node --check tests/provider-smoke-contract-v41.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Provider and canonical health regression
        run: node tests/provider-smoke-contract-v41.test.mjs
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
